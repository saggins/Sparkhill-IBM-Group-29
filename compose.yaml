services:
  web:
    build: .
    image: sparkhill-backend
    ports:
      - "8000:8000"
    # SECRET_KEY and GOOGLE_OAUTH_CLIENT_ID (see .env.example)
    env_file: backend/.env
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - db-data:/data
    restart: unless-stopped

  # Emails daily recommendations at RECOMMENDATION_SEND_TIME (America/Los_Angeles).
  scheduler:
    image: sparkhill-backend
    command: python manage.py schedule_recommendations
    env_file: backend/.env
    environment:
      RECOMMENDATION_SEND_TIME: "20:00"
    volumes:
      - db-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db-data:
